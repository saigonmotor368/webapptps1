<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Đặt hàng TPS1 | Thực Phẩm Số Một</title>
    <meta name="description" content="Cổng đặt hàng trực tuyến dành cho khách hàng VIP của Thực Phẩm Số Một. Đặt hàng nhanh chóng, tiện lợi." />
    <meta name="theme-color" content="#0b4f34" />
    <!-- Open Graph / Facebook / Zalo -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://dathang.thucphamsomot.vn/" />
    <meta property="og:title" content="Đặt hàng TPS1 | Thực Phẩm Số Một" />
    <meta property="og:description" content="Cổng đặt hàng trực tuyến dành cho khách hàng VIP của Thực Phẩm Số Một. Đặt hàng nhanh chóng, tiện lợi." />
    <meta property="og:image" content="https://dathang.thucphamsomot.vn/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="vi_VN" />
    <meta property="og:site_name" content="Thực Phẩm Số Một" />
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Đặt hàng TPS1 | Thực Phẩm Số Một" />
    <meta name="twitter:description" content="Cổng đặt hàng trực tuyến dành cho khách hàng VIP của Thực Phẩm Số Một." />
    <meta name="twitter:image" content="https://dathang.thucphamsomot.vn/og-image.jpg" />
    <!-- iOS PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="TPS1 Đặt hàng" />
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        min-height: 100%;
        min-height: 100dvh;
        background-color: #ffffff;
        -webkit-tap-highlight-color: transparent;
      }
      #app-splash {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        background-color: #ffffff;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 999999;
        font-family: system-ui, -apple-system, sans-serif;
      }
      .app-splash-logo {
        width: 140px;
        max-width: 50vw;
        height: auto;
        object-fit: contain;
        margin-bottom: 24px;
        animation: tps1-pulse 2s ease-in-out infinite;
      }
      .app-splash-spinner {
        width: 32px;
        height: 32px;
        border: 3px solid #eaf6ef;
        border-top-color: #0f7a4f;
        border-radius: 50%;
        animation: tps1-spin 0.8s linear infinite;
      }
      @keyframes tps1-spin {
        to { transform: rotate(360deg); }
      }
      @keyframes tps1-pulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.03); opacity: 0.92; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="app-splash">
        <img src="/images/tps1-logo-vertical.png" alt="Thực Phẩm Số Một" class="app-splash-logo" />
        <div class="app-splash-spinner"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
